name: Metrics
on:
  schedule: [{cron: "0 0 * * 1"}]   # Weekly, Mondays 00:00 UTC
  workflow_dispatch:

# No `push` trigger on purpose: the action commits the SVG back to this repo,
# which would re-trigger the workflow in a loop.

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    environment:
      name: production
    permissions:
      contents: write

    steps:
      # ── Most-used languages card ─────────────────────────────────────
      - name: Languages
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.PRIVATE_TOKEN }}
          committer_token: ${{ secrets.GITHUB_TOKEN }}   # commit as the bot so pushes don't trigger workflows
          committer_message: "chore: update ${filename} [skip ci]"

          filename: github-metrics-languages.svg
          config_output: svg
          config_timezone: America/Edmonton
          retries_output_action: 5

          base: ""                               # languages block only
          repositories: 100
          repositories_skipped: ${{ secrets.REPOS_TO_SKIP }}

          # In-depth analysis attributes code to *your* commits, so it must know
          # every name/email you have authored with — otherwise the card comes
          # back nearly empty.
          commits_authoring: dev.nfracchia@gmail.com, Nicolas Fracchia, nfracchia-pw, nicolasfracchia

          plugin_languages: yes
          plugin_languages_sections: most-used
          plugin_languages_indepth: yes
          plugin_languages_analysis_timeout: 15
          plugin_languages_analysis_timeout_repositories: 7.5
          plugin_languages_categories: markup, programming
          plugin_languages_limit: 8
          plugin_languages_threshold: 1%
          plugin_languages_details: percentage, bytes-size
